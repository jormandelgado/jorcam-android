name: Compilar app de Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Poner la clave pública de licencias (si está en los secretos)
        env:
          CLAVE_PUBLICA: ${{ secrets.CLAVE_PUBLICA_HEX }}
        run: |
          if [ -n "$CLAVE_PUBLICA" ]; then
            printf '%s' "$CLAVE_PUBLICA" > android/app/src/main/res/raw/clave_publica.txt
            echo "Clave pública tomada de los secretos."
          else
            echo "No hay secreto CLAVE_PUBLICA_HEX: se usa el archivo clave_publica.txt del proyecto."
          fi

      - name: Preparar la firma (si hay llave en los secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jorcam.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/jorcam.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Se firmará con tu llave."
          else
            echo "Sin llave propia: el APK se firmará con la llave de depuración (sirve para instalar y probar)."
          fi

      - name: Compilar el APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: JorCam-android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publicar en Releases (solo con etiqueta android-v...)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
